name: iOS unsigned IPA

# Builds mobile/ as an UNSIGNED .ipa on a macOS runner, so the phone build does not
# depend on an interactive Apple sign-in. James re-signs and installs it with Sideloadly
# (free Apple ID = 7-day signing, 3 apps; paid = 1 year). No certificates, no
# provisioning profiles, and no Apple session ever live in CI.
#
# The app asks for no paid-tier entitlements (no push, no associated domains, no app
# groups); UIBackgroundModes "location" is an Info.plist key, so the Glasses Walk trail
# still runs under free provisioning.
#
# Cost: macOS minutes bill at 10x on a private repo. The cheap checks run on Ubuntu (1x)
# and gate the macOS job, so a broken bundle never reaches the expensive runner. Manual
# dispatch only, on purpose: a 25-minute macOS build costs ~250 of the free plan's 2,000
# monthly minutes, so it must never fire on an ordinary push.

on:
  workflow_dispatch:
    inputs:
      note:
        description: Why this build (shown in the artifact name)
        required: false
        default: manual

concurrency:
  group: ios-ipa
  cancel-in-progress: true

env:
  EXPO_NO_TELEMETRY: '1'
  CI: '1'

jobs:
  checks:
    name: Typecheck and bundle (cheap runner)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        working-directory: mobile
        run: npx tsc --noEmit
      - name: Config introspects
        working-directory: mobile
        run: npx expo config --type introspect --json > /dev/null
      - name: Metro bundles for iOS
        working-directory: mobile
        run: npx expo export --platform ios --output-dir dist-ci

  build:
    name: Archive unsigned IPA
    needs: checks
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # The macos-15 image defaults to Xcode 16.4 (Swift 6.1), and Expo SDK 57's
      # ExpoModulesJSI SwiftPM package declares swift-tools 6.2, so the xcframework build
      # phase dies with "package 'apple' is using Swift tools version 6.2.0 but the
      # installed version is 6.1.0". Xcode 26 is on the image; select the newest one.
      # Expo SDK 57 is picky about the toolchain and the runner carries eleven Xcodes:
      #   - image default 16.4: ExpoModulesJSI's SwiftPM manifest declares swift-tools 6.2,
      #     so package resolution fails before anything compiles.
      #   - Xcode 26.3: clang rejects SWIFT_RETURNS_RETAINED on the RuntimeScheduler
      #     constructors in expo-modules-jsi (57.0.6 still ships them), so the xcframework
      #     will not build. Every Xcode 26.x reports "Apple Swift version 6.2", so the Swift
      #     version cannot tell them apart.
      # Publish the 26.x line newest-first and let the archive step walk it; the failure is
      # early and cheap, so one run finds the newest Xcode that actually compiles.
      - name: Toolchain
        run: |
          set -uo pipefail
          CANDIDATES=""
          for V in 26.2 26.3; do
            for X in "/Applications/Xcode_$V.app" "/Applications/Xcode_$V.0.app" "/Applications/Xcode_$V.1.app"; do
              if [ -d "$X" ]; then CANDIDATES="$CANDIDATES $X"; break; fi
            done
          done
          if [ -z "$CANDIDATES" ]; then
            echo "::error::No Xcode 26.2 or 26.3 on this runner"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          echo "Candidates:$CANDIDATES"
          echo "XCODE_CANDIDATES=$CANDIDATES" >> "$GITHUB_ENV"
          FIRST=$(echo $CANDIDATES | cut -d' ' -f1)
          sudo xcode-select -s "$FIRST/Contents/Developer"
          echo "DEVELOPER_DIR=$FIRST/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
          pod --version

      - name: Install
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      # expo-modules-jsi 57.0.5 (and 57.0.6) annotate the RuntimeScheduler constructors
      # with SWIFT_RETURNS_RETAINED. Every Xcode 26 clang on this image rejects that:
      # "cannot be annotated with either SWIFT_RETURNS_RETAINED or SWIFT_RETURNS_UNRETAINED
      # because it is not returning a SWIFT_SHARED_REFERENCE type" — a constructor does not
      # return, so the attribute never applied. The class itself still carries
      # SWIFT_SHARED_REFERENCE(retainRuntimeScheduler, releaseRuntimeScheduler) and Swift
      # imports a foreign reference type's constructors at +1 regardless, so dropping the
      # attribute changes no ownership behaviour. Remove when upstream drops it.
      - name: Patch expo-modules-jsi for Xcode 26 clang
        working-directory: mobile
        run: |
          set -euo pipefail
          H=node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI-Cxx/include/RuntimeScheduler.h
          test -f "$H"
          BEFORE=$(grep -c "SWIFT_RETURNS_RETAINED RuntimeScheduler(" "$H" || true)
          if [ "$BEFORE" = "0" ]; then
            echo "Nothing to patch; upstream looks fixed."
            exit 0
          fi
          sed -i '' 's/SWIFT_RETURNS_RETAINED RuntimeScheduler(/RuntimeScheduler(/' "$H"
          AFTER=$(grep -c "SWIFT_RETURNS_RETAINED RuntimeScheduler(" "$H" || true)
          grep -q "SWIFT_SHARED_REFERENCE(retainRuntimeScheduler" "$H"
          echo "Removed $BEFORE constructor annotations, $AFTER left; shared-reference marker intact."

      - name: Prebuild iOS project
        working-directory: mobile
        run: npx expo prebuild --platform ios --no-install --clean

      - name: Install CocoaPods
        working-directory: mobile/ios
        run: pod install --repo-update

      - name: Archive without signing
        working-directory: mobile/ios
        run: |
          set -uo pipefail
          # GitHub runs this block with `bash -e`, so a failed attempt would kill the step
          # before the loop could try the next Xcode.
          set +e
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "workspace=$WORKSPACE scheme=$SCHEME"
          OK=""
          for X in $XCODE_CANDIDATES; do
            echo "::group::xcodebuild under $(basename "$X")"
            # Derive into ios/derived, never ios/build: pod install writes React Native's
            # codegen output to ios/build/generated, and clearing it between attempts costs
            # you safeareacontext-generated.mm and friends.
            rm -rf derived
            DEVELOPER_DIR="$X/Contents/Developer" xcodebuild \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath derived \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGN_ENTITLEMENTS="" \
              PROVISIONING_PROFILE_SPECIFIER="" \
              build > xcodebuild.log 2>&1
            RC=$?
            echo "::endgroup::"
            if [ "$RC" -eq 0 ]; then
              echo "Built with $(basename "$X")"
              OK="$X"
              break
            fi
            echo "::warning::$(basename "$X") failed (exit $RC); trying the next Xcode"
            grep -E "error:" xcodebuild.log | head -10
            cp xcodebuild.log "xcodebuild-$(basename "$X").log"
          done
          if [ -z "$OK" ]; then
            echo "no Xcode on this runner could build the app"
            tail -120 xcodebuild.log
            exit 1
          fi
          APP=$(find derived/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' | head -1)
          test -d "$APP" || { echo "no .app produced"; tail -200 xcodebuild.log; exit 1; }
          # Sideloadly re-signs, but a leftover embedded profile confuses some sideloaders.
          rm -f "$APP/embedded.mobileprovision"
          rm -rf Payload SideQuestATX-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry SideQuestATX-unsigned.ipa Payload
          ls -la SideQuestATX-unsigned.ipa
          unzip -l SideQuestATX-unsigned.ipa | head -20

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SideQuestATX-unsigned-${{ github.run_number }}-${{ inputs.note || 'push' }}
          path: mobile/ios/SideQuestATX-unsigned.ipa
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-${{ github.run_number }}
          path: |
            mobile/ios/xcodebuild.log
            mobile/ios/xcodebuild-Xcode_*.log
          if-no-files-found: ignore
          retention-days: 7
